name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/habersosyal-app-development-80qbwn

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: Write .env
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=617547291044-vr9hdgkdrk9qbbc1lvnckosj5hr40cv0.apps.googleusercontent.com
          EXPO_PUBLIC_ADMOB_ANDROID_APP_ID=ca-app-pub-3940256099942544~3347511713
          EXPO_PUBLIC_ADMOB_IOS_APP_ID=ca-app-pub-3940256099942544~1458002511
          EXPO_PUBLIC_ADMOB_BANNER_ANDROID=ca-app-pub-3940256099942544/6300978111
          EXPO_PUBLIC_ADMOB_BANNER_IOS=ca-app-pub-3940256099942544/2934735716
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID=ca-app-pub-3940256099942544/1033173712
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS=ca-app-pub-3940256099942544/4411468910
          EXPO_PUBLIC_ADMOB_NATIVE_ANDROID=ca-app-pub-3940256099942544/2247696110
          EXPO_PUBLIC_ADMOB_NATIVE_IOS=ca-app-pub-3940256099942544/3986624511
          EXPO_PUBLIC_ADMOB_APP_OPEN_ANDROID=ca-app-pub-3940256099942544/3419835294
          EXPO_PUBLIC_ADMOB_APP_OPEN_IOS=ca-app-pub-3940256099942544/5662855259
          EXPO_PUBLIC_ADS_TEST_MODE=true
          EOF

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: haberly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
